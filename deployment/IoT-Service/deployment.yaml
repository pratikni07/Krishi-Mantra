apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-device-simulator
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-device-simulator
  template:
    metadata:
      labels:
        app: iot-device-simulator
    spec:
      containers:
      - name: iot-device-simulator
        image: your-registry/iot-service:latest
        imagePullPolicy: Always
        env:
        - name: APP_TYPE
          value: "device"
        - name: DEVICE_ID
          value: "device-001"
        envFrom:
        - configMapRef:
            name: iot-service-config
        - secretRef:
            name: iot-service-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
