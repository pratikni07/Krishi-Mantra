# Anonymous access is disabled. Every client must authenticate with a
# username/password from the password file. Seed the file before first
# boot with:
#
#   docker run --rm -v $(pwd)/mosquitto/config:/mosquitto/config \
#     eclipse-mosquitto:latest \
#     mosquitto_passwd -c /mosquitto/config/passwd <username>
#
# Add more users with `mosquitto_passwd` (without -c) and restart.
allow_anonymous false
password_file /mosquitto/config/passwd

# Topic ACLs. The default policy is deny; the acl file grants least-
# privilege access per user (see mosquitto/config/acl).
acl_file /mosquitto/config/acl

# Plain-text listener for intra-cluster traffic only. Do NOT expose this
# port publicly — put it behind a network policy / firewall.
listener 1883

# TLS listener for anything crossing an untrusted network (field devices,
# public internet). Uncomment once certs are provisioned.
# listener 8883
# cafile    /mosquitto/certs/ca.crt
# certfile  /mosquitto/certs/server.crt
# keyfile   /mosquitto/certs/server.key
# require_certificate false
# tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
